[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-deepinfer"
version = "0.0.0"
description = "Independent, research-first LLM inference engine (Stage 00 foundation)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "nano-deepinfer contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2,<10", "ruff>=0.6,<1", "mypy>=1.10,<2"]
reference = ["torch>=2.3", "transformers>=4.50,<6", "safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "scripts"]
